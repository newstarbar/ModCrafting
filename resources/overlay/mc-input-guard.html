<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>MC Input Guard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", "PingFang SC", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 锁定状态遮罩：overlay 有焦点，始终可见 */
    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.12);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .overlay.visible {
      display: flex;
    }

    /* 提示卡片 */
    .card {
      background: rgba(20, 22, 28, 0.82);
      color: #f0f2f5;
      padding: 22px 30px;
      border-radius: 10px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      text-align: center;
      max-width: 420px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .card .title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #ffffff;
    }
    .card .desc {
      font-size: 13px;
      line-height: 1.6;
      color: rgba(240, 242, 245, 0.78);
      margin-bottom: 16px;
    }

    /* 恢复按钮 */
    .restore-btn {
      padding: 8px 22px;
      background: rgba(74, 144, 217, 0.92);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.18s ease, transform 0.1s ease;
    }
    .restore-btn:hover { background: rgba(53, 122, 189, 0.95); }
    .restore-btn:active { transform: scale(0.97); }

    /* 解锁后的状态指示器（小圆点） */
    .status-indicator {
      position: fixed;
      bottom: 14px;
      right: 14px;
      display: none;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      background: rgba(20, 22, 28, 0.72);
      color: rgba(240, 242, 245, 0.85);
      border-radius: 12px;
      font-size: 11px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      cursor: pointer;
    }
    .status-indicator.visible { display: flex; }
    .status-indicator .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #5bca6b;
      box-shadow: 0 0 6px rgba(91, 202, 107, 0.6);
    }
  </style>
</head>
<body>
  <div class="overlay" id="overlay">
    <div class="card">
      <div class="title">AI 自测进行中</div>
      <div class="desc">
        当前正在处于 AI 自测期间，您的操作可能会影响 AI 自测的效果。<br />
        如需手动操作，请点击下方按钮恢复控制（AI 仍会继续自测）。
      </div>
      <button class="restore-btn" id="restoreBtn">恢复手动控制</button>
    </div>
  </div>

  <div class="status-indicator" id="statusIndicator" title="点击重新锁定输入">
    <span class="dot"></span>
    <span id="statusText">手动模式</span>
  </div>

  <script>
    (function () {
      const { ipcRenderer } = require('electron');
      const overlay = document.getElementById('overlay');
      const restoreBtn = document.getElementById('restoreBtn');
      const statusIndicator = document.getElementById('statusIndicator');

      let isLocked = true;

      // 锁定状态：显示全屏遮罩 + 恢复按钮（overlay 有焦点，按钮直接可点击）
      // 解锁状态：显示状态指示器（overlay 穿透，需 hover-to-click 模式）
      function setLocked(locked) {
        isLocked = locked;
        if (locked) {
          overlay.classList.add('visible');
          statusIndicator.classList.remove('visible');
        } else {
          overlay.classList.remove('visible');
          statusIndicator.classList.add('visible');
        }
      }

      // 点击恢复按钮 → 切换到解锁状态
      restoreBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        setLocked(false);
        ipcRenderer.send('mc-input-guard:restore');
      });

      // 解锁状态下 hover-to-click：鼠标进入指示器区域时临时关闭穿透
      statusIndicator.addEventListener('mouseenter', () => {
        if (!isLocked) {
          // 临时关闭穿透以接收点击
          // 注意：此 API 仅在 Electron 主进程生效，这里通过 IPC 请求
          ipcRenderer.send('mc-input-guard:hover-start');
        }
      });
      statusIndicator.addEventListener('mouseleave', () => {
        if (!isLocked) {
          ipcRenderer.send('mc-input-guard:hover-end');
        }
      });

      // 点击状态指示器 → 重新锁定
      statusIndicator.addEventListener('click', () => {
        setLocked(true);
        ipcRenderer.send('mc-input-guard:lock');
      });

      // 接收主进程状态变更
      ipcRenderer.on('mc-input-guard:state', (_event, state) => {
        if (state === 'locked') {
          setLocked(true);
        } else if (state === 'unlocked') {
          setLocked(false);
        }
      });

      // 初始为锁定状态
      setLocked(true);
    })();
  </script>
</body>
</html>
