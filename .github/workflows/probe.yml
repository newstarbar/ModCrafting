name: probe

# The compile loop the content emitters need. Local development on Windows cannot
# reach the NeoForge maven or the 26.x mappings, so the only honest way to expand
# the Java emitters (Mojmap, DeferredRegister) is to prove them on a runner that can.
on:
  workflow_dispatch:
    inputs:
      loader:
        description: "Loader to probe (fabric/neoforge/forge, empty = all)"
        required: false
        default: ""
      content:
        description: "Also compile generated content + GUI"
        type: boolean
        default: true
  schedule:
    - cron: "0 3 * * 1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # 26.x targets need JDK 25; everything up to 1.21.11 needs 21 or 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - name: Cache Gradle and Loom
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: probe-gradle-${{ runner.os }}-${{ hashFiles('packages/modcrafting-core/src/version/catalog.json') }}
          restore-keys: probe-gradle-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Gradle 9.8 for the 26.x toolchain
        run: |
          mkdir -p temp/gradle-dist
          curl -sSL --retry 3 -o temp/gradle-dist/gradle-9.8.0-bin.zip https://services.gradle.org/distributions/gradle-9.8.0-bin.zip
          unzip -q temp/gradle-dist/gradle-9.8.0-bin.zip -d temp/gradle-dist
      - name: Probe matrix
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-ci
        run: |
          ARGS=""
          if [ -n "${{ inputs.loader }}" ]; then ARGS="--loader ${{ inputs.loader }}"; fi
          # --record rewrites catalog.json in the workspace; CI reports instead of committing.
          node --experimental-strip-types scripts/probe/all.mjs $ARGS ${{ inputs.content && '--content' || '' }} --json probe-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-summary
          path: |
            probe-summary.json
            temp/probe/**/probe-build.log
          if-no-files-found: warn
