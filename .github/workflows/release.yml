name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache toolchain resources
        uses: actions/cache@v4
        with:
          path: |
            resources/jdk-21
            resources/gradle-9.5
            resources/gradle-home-seed
            resources/jre-21-minimal
          key: toolchain-${{ hashFiles('resources/fabric-versions.json') }}

      - name: Cache Minecraft client assets
        uses: actions/cache@v4
        with:
          path: temp/minecraft-assets-1.21.4
          key: mc-assets-${{ hashFiles('resources/fabric-versions.json') }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python asset dependencies
        run: pip install -r scripts/assets/requirements-assets.txt

      - name: Install dependencies
        run: npm ci

      - name: Cache NSISBI toolset
        uses: actions/cache@v4
        with:
          path: packaging/nsisbi
          key: nsisbi-3.10.3-${{ runner.os }}

      - name: Setup NSISBI toolset
        run: node scripts/packaging/setup-nsisbi.mjs

      - name: Run harness tests
        run: npm run test

      - name: Setup full toolchain
        run: npm run toolchain:setup

      - name: Prefetch Fabric deps
        run: npm run toolchain:prefetch

      - name: Verify toolchain
        run: npm run toolchain:verify

      - name: Generate Fabric symbol index
        run: npm run toolchain:symbol-index

      - name: Download knowledge bases
        run: node scripts/knowledge/download-knowledge-base.mjs

      - name: Archive extra resources (knowledge base + symbol index + base mods)
        run: node scripts/release/archive-extra-resources.mjs

      - name: Prepare installer assets
        run: |
          npm run assets:icon
          node scripts/packaging/patch-nsis-install-ui.mjs

      - name: Prepare renderer assets
        run: npm run assets:prepare

      - name: Render release notes
        run: npm run release:notes -- "${{ github.ref_name }}"

      - name: Render update manifest
        run: npm run release:manifest -- "${{ github.ref_name }}"

      - name: Build app
        run: npm run build

      - name: Verify version matches tag
        shell: bash
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "ERROR: package.json version ($PKG_VER) != tag ($TAG_VER)"
            exit 1
          fi
          echo "Version OK: $PKG_VER"

      - name: Cleanup duplicate GitHub Release
        shell: bash
        run: npm run release:cleanup-github -- "${{ github.ref_name }}"

      - name: Build Setup (NSIS) and publish GitHub Release
        run: node scripts/packaging/run-electron-builder.mjs --win nsis --publish always

      - name: Verify unique Release for tag
        shell: bash
        run: |
          # cleanup 已删除所有同 tag Release，electron-builder 刚创建唯一的 draft Release。
          # 此处做断言：同 tag 下必须恰好 1 个 Release。若违反，直接 fail —— 避免后续
          # gh release upload/edit 遇到同 tag 多 Release 时行为不确定（有的步骤操作
          # 旧 published，有的操作新 draft，导致 draft 残留和 assets 分裂）。
          TAG="${{ github.ref_name }}"
          # 列全部 Release（默认 limit 可能仅列部分，给 --limit 100 避免漏掉）
          # 注意：gh release list --json 不支持 id 字段（仅支持 createdAt/isDraft/name/publishedAt/tagName 等）
          JSON=$(gh release list --limit 100 --json tagName,isDraft,name,isLatest \
            | jq --arg tag "$TAG" '[.[] | select(.tagName == $tag)]')
          COUNT=$(echo "$JSON" | jq 'length')
          echo "Found $COUNT release(s) for tag $TAG"
          echo "$JSON" | jq -c '.[]' | while read -r r; do
            DRAFT=$(echo "$r" | jq -r '.isDraft')
            NAME=$(echo "$r" | jq -r '.name')
            echo "  - draft=$DRAFT name=$NAME"
          done
          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: expected exactly 1 release for tag $TAG, got $COUNT"
            echo "Cleanup or electron-builder may have misbehaved — inspect the list above and retry."
            exit 1
          fi
          DRAFT=$(echo "$JSON" | jq -r '.[0].isDraft')
          if [ "$DRAFT" != "true" ]; then
            # 不是 draft 但只有一个，可能是重新发布。给 warning 但不 fail。
            echo "WARNING: the only release for $TAG is not a draft (isDraft=$DRAFT)"
          fi
          echo "OK — verified unique release for tag=$TAG (draft=$DRAFT)"

      - name: Build Portable
        run: node scripts/packaging/run-electron-builder.mjs --config electron-builder.portable.json --win portable --publish never

      - name: Upload Portable to GitHub Release
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          PORTABLE="release/ModCrafting-${VER}-Portable.exe"
          if [ -f "$PORTABLE" ]; then
            # 使用 tag 操作，但前面 Resolve 步骤已保证同 tag 只有 1 个 Release，不会歧义
            gh release upload "${{ github.ref_name }}" "$PORTABLE" --clobber
          else
            echo "Portable not found: $PORTABLE"
            echo "Contents of release/ dir:"
            ls -la release/ || true
            exit 1
          fi

      - name: Upload extra resources to GitHub Release
        shell: bash
        run: |
          EXTRA_DIR="resources/extra-zips"
          if [ ! -d "$EXTRA_DIR" ]; then
            echo "Extra resources dir not found: $EXTRA_DIR"
            exit 1
          fi
          echo "Uploading extra resources (agent-knowledge / fabric-symbol-index / base-mods)..."
          shopt -s nullglob
          for f in "$EXTRA_DIR"/*.zip "$EXTRA_DIR"/*.tar.xz "$EXTRA_DIR"/*.xz; do
            if [ -f "$f" ]; then
              echo "  uploading $(basename "$f")"
              gh release upload "${{ github.ref_name }}" "$f" --clobber
            fi
          done
          echo "Extra resources uploaded."

      - name: Apply release notes to GitHub Release
        shell: bash
        run: |
          # Resolve 步骤已保证同 tag 只有 1 个 Release，gh release edit 不会歧义
          gh release edit "${{ github.ref_name }}" \
            --title "ModCrafting ${{ github.ref_name }}" \
            --notes-file packaging/release-body.md \
            --draft=false

      - name: Commit update manifest
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          MANIFEST="packaging/update-manifest.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "Manifest not found, skip"
            exit 0
          fi
          git remote remove gitee 2>/dev/null || true
          git fetch origin main
          git checkout -B main origin/main
          git pull --ff-only origin main
          git checkout "${{ github.sha }}" -- "$MANIFEST"
          git add "$MANIFEST"
          if git diff --staged --quiet; then
            echo "Manifest unchanged on main, skip"
            exit 0
          fi
          git commit -m "chore: update manifest for ${{ github.ref_name }}"
          git push origin main
