name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache toolchain resources
        uses: actions/cache@v4
        with:
          path: |
            resources/jdk-21
            resources/gradle-9.5
            resources/gradle-home-seed
            resources/jre-21-minimal
          key: toolchain-${{ hashFiles('resources/fabric-versions.json') }}

      - name: Cache Minecraft client assets
        uses: actions/cache@v4
        with:
          path: temp/minecraft-assets-1.21.4
          key: mc-assets-${{ hashFiles('resources/fabric-versions.json') }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python asset dependencies
        run: pip install -r scripts/assets/requirements-assets.txt

      - name: Install dependencies
        run: npm ci

      - name: Cache NSISBI toolset
        uses: actions/cache@v4
        with:
          path: packaging/nsisbi
          key: nsisbi-3.10.3-${{ runner.os }}

      - name: Setup NSISBI toolset
        run: node scripts/packaging/setup-nsisbi.mjs

      - name: Run harness tests
        run: npm run test

      - name: Setup full toolchain
        run: npm run toolchain:setup

      - name: Strip Gradle distribution
        run: npm run toolchain:strip-gradle

      - name: Build jlink JRE
        run: npm run toolchain:build-jre

      - name: Prefetch Fabric deps
        run: npm run toolchain:prefetch

      - name: Verify toolchain
        run: npm run toolchain:verify

      - name: Generate Fabric symbol index
        run: npm run toolchain:symbol-index

      - name: Download knowledge bases
        run: node scripts/knowledge/download-knowledge-base.mjs

      - name: Prepare seed for packaging
        run: node scripts/toolchain/prepare-seed-for-packaging.mjs

      - name: Archive gradle home seed (tar.xz)
        run: node scripts/toolchain/archive-gradle-home-seed.mjs

      - name: Split seed shards
        run: node scripts/release/split-seed-shards.mjs

      - name: Archive JRE minimal (tar.xz)
        run: node scripts/toolchain/archive-jre-minimal.mjs

      - name: Split JRE shards
        run: node scripts/release/split-jre-shards.mjs

      - name: Archive extra resources (knowledge base + symbol index + base mods)
        run: node scripts/release/archive-extra-resources.mjs

      - name: Archive opencode binary (tar.xz)
        run: node scripts/release/archive-opencode.mjs

      - name: Prepare installer assets
        run: |
          npm run assets:icon
          node scripts/packaging/patch-nsis-install-ui.mjs

      - name: Prepare renderer assets
        run: npm run assets:prepare

      - name: Render release notes
        run: npm run release:notes -- "${{ github.ref_name }}"

      - name: Render update manifest
        run: npm run release:manifest -- "${{ github.ref_name }}"

      - name: Build app
        run: npm run build

      - name: Cleanup duplicate GitHub Release
        shell: bash
        run: npm run release:cleanup-github -- "${{ github.ref_name }}"

      - name: Build Setup (NSIS) and publish GitHub Release
        run: node scripts/packaging/run-electron-builder.mjs --win nsis --publish always

      - name: Build Portable
        run: node scripts/packaging/run-electron-builder.mjs --config electron-builder.portable.json --win portable --publish never

      - name: Upload Portable to GitHub Release
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          PORTABLE="release/ModCrafting ${VER} Portable.exe"
          if [ -f "$PORTABLE" ]; then
            gh release upload "${GITHUB_REF_NAME}" "$PORTABLE" --clobber
          else
            echo "Portable not found: $PORTABLE"
            exit 1
          fi

      - name: Upload seed shards to GitHub Release
        shell: bash
        run: |
          SHARDS_DIR="resources/seed-shards"
          if [ ! -d "$SHARDS_DIR" ]; then
            echo "Seed shards dir not found: $SHARDS_DIR"
            exit 1
          fi
          echo "Uploading seed shards..."
          for f in "$SHARDS_DIR"/*; do
            if [ -f "$f" ]; then
              echo "  uploading $(basename "$f")"
              gh release upload "${GITHUB_REF_NAME}" "$f" --clobber
            fi
          done
          echo "Seed shards uploaded."

      - name: Upload JRE shards to GitHub Release
        shell: bash
        run: |
          JRE_SHARDS_DIR="resources/jre-shards"
          if [ ! -d "$JRE_SHARDS_DIR" ]; then
            echo "JRE shards dir not found: $JRE_SHARDS_DIR"
            exit 1
          fi
          echo "Uploading JRE shards..."
          for f in "$JRE_SHARDS_DIR"/*; do
            if [ -f "$f" ]; then
              echo "  uploading $(basename "$f")"
              gh release upload "${GITHUB_REF_NAME}" "$f" --clobber
            fi
          done
          echo "JRE shards uploaded."

      - name: Upload extra resources to GitHub Release
        shell: bash
        run: |
          EXTRA_DIR="resources/extra-zips"
          if [ ! -d "$EXTRA_DIR" ]; then
            echo "Extra resources dir not found: $EXTRA_DIR"
            exit 1
          fi
          echo "Uploading extra resources (agent-knowledge / fabric-symbol-index / base-mods / opencode)..."
          shopt -s nullglob
          for f in "$EXTRA_DIR"/*.zip "$EXTRA_DIR"/*.tar.xz "$EXTRA_DIR"/*.xz; do
            if [ -f "$f" ]; then
              echo "  uploading $(basename "$f")"
              gh release upload "${GITHUB_REF_NAME}" "$f" --clobber
            fi
          done
          echo "Extra resources uploaded."

      - name: Apply release notes to GitHub Release
        shell: bash
        run: |
          gh release edit "${GITHUB_REF_NAME}" \
            --title "ModCrafting ${GITHUB_REF_NAME}" \
            --notes-file packaging/release-body.md \
            --draft=false

      - name: Push git ref and tag to Gitee
        continue-on-error: false
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ vars.GITEE_OWNER }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
        run: npm run release:push-gitee -- "${{ github.ref_name }}"

      - name: Sync Gitee Release
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ vars.GITEE_OWNER }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
          GITHUB_SHA: ${{ github.sha }}
        run: npm run release:sync-gitee -- "${{ github.ref_name }}"

      - name: Commit update manifest
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          MANIFEST="packaging/update-manifest.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "Manifest not found, skip"
            exit 0
          fi
          git remote remove gitee 2>/dev/null || true
          git fetch origin main
          git checkout -B main origin/main
          git pull --ff-only origin main
          git checkout "${{ github.sha }}" -- "$MANIFEST"
          git add "$MANIFEST"
          if git diff --staged --quiet; then
            echo "Manifest unchanged on main, skip"
            exit 0
          fi
          git commit -m "chore: update manifest for ${{ github.ref_name }}"
          git push origin main
